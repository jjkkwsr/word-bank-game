<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Quest - Movers Word Bank Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Theme Selection FAB -->
    <div class="theme-fab-container">
        <button id="theme-menu-btn" class="theme-fab" title="Switch Theme">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <div class="theme-dropdown hidden" id="theme-dropdown-menu">
            <button class="theme-dropdown-item active" data-theme="default">
                <span class="theme-dot" style="background: linear-gradient(135deg, #6366f1, #ec4899);"></span>
                Aurora
            </button>
            <button class="theme-dropdown-item" data-theme="jungle">
                <span class="theme-dot" style="background: linear-gradient(135deg, #10b981, #06b6d4);"></span>
                Jungle
            </button>
            <button class="theme-dropdown-item" data-theme="sunset">
                <span class="theme-dot" style="background: linear-gradient(135deg, #f97316, #e11d48);"></span>
                Sunset
            </button>
            <button class="theme-dropdown-item" data-theme="sakura">
                <span class="theme-dot" style="background: linear-gradient(135deg, #f472b6, #fda4af);"></span>
                Sakura
            </button>
        </div>
    </div>

    <main class="glass-container" id="app-container">
        <!-- Section 1: Lesson Selection Menu -->
        <section id="view-menu" class="view active">
            <h1 class="brand-title">Story Quest</h1>
            <div class="subtitle">Movers English Word Bank Adventure</div>
            
            <div class="lessons-grid">
                <button class="lesson-card-btn" data-lesson="1_a_favourite_toy_shop.csv">
                    <span class="lesson-num">Lesson 1</span>
                    <span class="lesson-name">A Favourite Toy Shop</span>
                </button>
                <button class="lesson-card-btn" data-lesson="2_the_party.csv">
                    <span class="lesson-num">Lesson 2</span>
                    <span class="lesson-name">The Party</span>
                </button>
                <button class="lesson-card-btn" data-lesson="3_at_the_doctors.csv">
                    <span class="lesson-num">Lesson 3</span>
                    <span class="lesson-name">At the Doctor's</span>
                </button>
                <button class="lesson-card-btn" data-lesson="4_uncle_charlies_hotel.csv">
                    <span class="lesson-num">Lesson 4</span>
                    <span class="lesson-name">Uncle Charlie's Hotel</span>
                </button>
                <button class="lesson-card-btn" data-lesson="5_from_the_countryside_to_the_jungle.csv">
                    <span class="lesson-num">Lesson 5</span>
                    <span class="lesson-name">Countryside to Jungle</span>
                </button>
                <button class="lesson-card-btn" data-lesson="6_the_weather.csv">
                    <span class="lesson-num">Lesson 6</span>
                    <span class="lesson-name">The Weather</span>
                </button>
                <button class="lesson-card-btn" data-lesson="7_our_town.csv">
                    <span class="lesson-num">Lesson 7</span>
                    <span class="lesson-name">Our Town</span>
                </button>
                <button class="lesson-card-btn" data-lesson="8_dreaming_of_holidays.csv">
                    <span class="lesson-num">Lesson 8</span>
                    <span class="lesson-name">Dreaming of Holidays</span>
                </button>
                <button class="lesson-card-btn" data-lesson="9_some_games.csv">
                    <span class="lesson-num">Lesson 9</span>
                    <span class="lesson-name">Some Games</span>
                </button>
            </div>
            
            <div class="custom-upload-section">
                <div class="divider"><span>OR</span></div>
                <div class="upload-row">
                    <button id="upload-trigger-btn" class="btn-outline">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Upload Custom CSV
                    </button>
                    <input type="file" id="csv-file-input" accept=".csv" hidden>
                </div>
            </div>
        </section>

        <!-- Section 2: Story Practice Game -->
        <section id="view-game" class="view">
            <div class="game-header-row">
                <button id="exit-game-btn" class="btn-icon-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back to Menu
                </button>
                <h2 id="story-title" class="game-title">Lesson Story</h2>
            </div>

            <!-- Floating / Shared Word Bank -->
            <div class="wordbank-section">
                <div class="wordbank-header">Word Bank</div>
                <div id="wordbank-chips" class="wordbank-chips-grid"></div>
            </div>

            <!-- Cohesive Story Text Container -->
            <div id="story-text-container" class="story-passage"></div>

            <button id="submit-quiz-btn" class="btn-primary" style="width: 100%; padding: 16px 0; font-size: 1.2rem; margin-top: 10px;">Check Answers</button>
        </section>

        <!-- Section 3: Quiz Score / Results -->
        <section id="view-result" class="view">
            <h2 class="result-title">Quest Complete!</h2>
            <div class="score-circle">
                <span id="final-score-text">0%</span>
            </div>
            <p id="summary-text" class="stats-summary"></p>
            
            <div class="result-controls">
                <button id="retry-story-btn" class="btn-primary" style="width: 100%;">Try This Story Again</button>
                <button id="menu-btn" class="btn-outline" style="width: 100%;">Choose Another Story</button>
            </div>
        </section>
    </main>

    <!-- Feedback Toast -->
    <div id="feedback-toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
